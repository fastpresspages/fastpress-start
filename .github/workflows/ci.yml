name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check app.js
          node --check config.js
          node --check scripts/serve.js
          node --check scripts/check-links.js
      - name: Local links
        run: node scripts/check-links.js
